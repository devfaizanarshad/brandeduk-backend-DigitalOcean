name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reject committed secrets
        run: node scripts/check-secrets.js

  deploy:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          test -n "$SERVER_IP" || { echo "SERVER_IP secret is required"; exit 1; }
          ssh -o StrictHostKeyChecking=no "root@$SERVER_IP" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /root/app

          if [ ! -f .env ]; then
            echo "Missing /root/app/.env. Provision production secrets on the server before deployment."
            exit 1
          fi

          chmod 600 .env

          current_jwt_secret="$(sed -n 's/^JWT_SECRET=//p' .env | tail -n 1 | tr -d '\r\"' | xargs)"
          if [ "${#current_jwt_secret}" -lt 32 ]; then
            new_jwt_secret="$(openssl rand -hex 32)"
            if grep -q '^JWT_SECRET=' .env; then
              sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$new_jwt_secret/" .env
            else
              printf '\nJWT_SECRET=%s\n' "$new_jwt_secret" >> .env
            fi
            unset new_jwt_secret
            echo "Rotated weak JWT secret in the protected server environment"
          fi
          unset current_jwt_secret

          git fetch origin main
          git reset --hard origin/main
          npm ci --omit=dev
          npm run config:check

          if pm2 describe branded-api >/dev/null 2>&1; then
            pm2 restart branded-api --update-env
          else
            pm2 start server.js --name branded-api
            pm2 save
          fi

          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail http://localhost:3004/health/live >/dev/null; then
              echo "Backend health check passed"
              exit 0
            fi
            echo "Waiting for backend startup ($attempt/12)"
            sleep 5
          done

          pm2 logs branded-api --lines 80 --nostream
          exit 1
          REMOTE
