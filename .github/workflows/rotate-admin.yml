name: Rotate Admin Credentials

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Rotate admin password
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_ROTATION_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_ROTATION_PASSWORD }}
        run: |
          test -n "$SERVER_IP" || { echo "SERVER_IP secret is required"; exit 1; }
          test -n "$ADMIN_EMAIL" || { echo "ADMIN_ROTATION_EMAIL secret is required"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "ADMIN_ROTATION_PASSWORD secret is required"; exit 1; }

          ssh -o StrictHostKeyChecking=no "root@$SERVER_IP" bash -s -- "$ADMIN_EMAIL" "$ADMIN_PASSWORD" <<'REMOTE'
          set -euo pipefail
          cd /root/app
          node - "$1" "$2" <<'NODE'
          const { queryWithTimeout, closePool } = require('./config/database');
          const { ensureCustomerTables } = require('./services/customerCheckoutService');
          const { hashPassword } = require('./utils/auth');

          const email = String(process.argv[2] || '').trim().toLowerCase();
          const password = String(process.argv[3] || '');

          (async () => {
            if (!email || !password) throw new Error('Admin credentials are required');
            await ensureCustomerTables();
            await queryWithTimeout(`
              INSERT INTO customer_users (name, email, password_hash, provider, role)
              VALUES ($1, $2, $3, 'local', 'admin')
              ON CONFLICT (email) DO UPDATE SET
                password_hash = EXCLUDED.password_hash,
                provider = 'local',
                role = 'admin',
                updated_at = CURRENT_TIMESTAMP
            `, ['BrandedUK Administrator', email, hashPassword(password)], 10000);
            console.log('Administrator password rotated');
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          }).finally(closePool);
          NODE
          REMOTE
